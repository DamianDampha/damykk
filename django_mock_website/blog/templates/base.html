<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gambia Weather Tracker{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.2);
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            padding: 3rem 0;
            color: white;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
        }

        .section {
            margin: 2rem 0;
        }

        h2 {
            color: white;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            border-bottom: 3px solid white;
            padding-bottom: 0.5rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
        }

        .card-header h3 {
            margin: 0;
            font-size: 1.5rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-meta {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: opacity 0.3s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .weather-stat {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .weather-stat .label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .weather-stat .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }

        .alert {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        .alert.warning {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .alert.info {
            background: #d1ecf1;
            border-left-color: #17a2b8;
        }

        footer {
            background: rgba(0, 0, 0, 0.4);
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }

        .weather-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            line-height: 1.8;
        }

        .city-info {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .temp-display {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
        }

        .condition-display {
            font-size: 1.5rem;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🌍 Gambia Weather</div>
            <ul class="nav-links">
                <li><a href="{% url 'blog:home' %}">Home</a></li>
                <li><a href="{% url 'blog:cities_list' %}">Cities</a></li>
                <li><a href="{% url 'blog:forecast' %}">Forecast</a></li>
                <li><a href="{% url 'blog:alerts' %}">Alerts</a></li>
                <li><a href="{% url 'blog:about' %}">About</a></li>
                <li><a href="{% url 'blog:contact' %}">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Gambia Weather Tracker. Providing accurate weather information for West Africa.</p>
    </footer>
</body>
</html>
